name: Ingest

# An Ingest Run every two hours: new Articles appear within about two hours of
# publication, which is what makes the reader current enough to be a primary
# source. Extraction runs here rather than in the Worker because the Workers
# free plan allows 10 ms of CPU per invocation (ADR-0001).
on:
  schedule:
    # Five past the even hours. Off the hour because that is when everything
    # else on GitHub's shared schedulers runs.
    - cron: '5 */2 * * *'
  workflow_dispatch:

# A slow Run must not race the next one into double-fetching or conflicting
# writes — and must not be cancelled by it either. Cancelling would abandon a
# Run midway through its Articles, which is the one outcome worse than a late
# Run.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # To push the heartbeat below. Nothing else here writes to the repository.
    permissions:
      contents: write
    # A Run fetches two Feeds and up to a hundred pages, politely and in
    # sequence. Well over what it needs; short enough that a wedged Run frees
    # the concurrency group before the next schedule.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Credentials come from repository secrets and are never committed: this
      # repository is public (ADR-0002). A Run that hits a tripwire exits
      # non-zero, which fails this step, which is how the failure becomes mail.
      - name: Ingest into D1
        run: pnpm ingest --store d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # GitHub disables a scheduled workflow after 60 days without repository
      # activity, and a disabled schedule is indistinguishable from a quiet
      # news day (ADR-0006). A dated file, committed once a day, is the
      # activity — cheap enough to be unnoticeable in the log, and it needs the
      # repository's Actions write permission (docs/setup.md, step 10).
      #
      # `always()`, because the 60 days do not pause while ingest is broken:
      # the one time the heartbeat must not stop is while something else has.
      - name: Heartbeat
        if: always()
        run: |
          date -u +%Y-%m-%d > .github/heartbeat
          git add .github/heartbeat
          if git diff --cached --quiet; then
            echo "Already beaten today."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Ingest heartbeat'
          # The branch may have moved since this Run checked it out. A rejected
          # push would be mail about nothing, which is the one thing that makes
          # a failure mail stop being read.
          git pull --rebase --quiet
          git push
